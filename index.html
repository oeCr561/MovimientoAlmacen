<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Movimiento RAS - Control de Inventario Doble Nodo</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="logo.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>

    <script>
        window.showSvgFallback = function(imgElement) {
            imgElement.style.display = 'none';
            const fallback = imgElement.nextElementSibling;
            if (fallback) fallback.classList.remove('hidden');
        };
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased selection:bg-pink-200">

    <div id="login-screen" class="flex-1 flex items-center justify-center p-4 min-h-screen bg-gradient-to-br from-pink-50 via-slate-50 to-sky-50">
        <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-xl border border-slate-100 max-w-md w-full text-center space-y-6">
            <div class="relative w-28 h-28 sm:w-32 sm:h-32 mx-auto">
                <img src="logo.png" alt="Logo Movimiento RAS" class="w-full h-full object-contain" onerror="window.showSvgFallback(this)">
                <div class="hidden w-full h-full flex items-center justify-center bg-pink-100 text-pink-600 rounded-2xl font-bold text-xl">RAS</div>
            </div>
            
            <div>
                <span class="text-xs font-bold uppercase tracking-widest text-pink-500 bg-pink-50 px-3 py-1 rounded-full">Acceso al Sistema</span>
                <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 mt-2">Movimiento <span class="text-pink-600">RAS</span></h1>
                <p class="text-slate-500 text-xs sm:text-sm mt-1">Control de Inventario Doble Almacén</p>
            </div>

            <form id="login-form" onsubmit="window.handleLogin(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">¿Quién eres?</label>
                    <select id="login-usuario" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-500 font-medium text-slate-700 text-sm">
                        <option value="Encargado Almacén Chico">Encargado Almacén Chico</option>
                        <option value="Coordinador General">Coordinador General</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Contraseña (PIN)</label>
                    <input type="password" id="login-pin" placeholder="••••" maxlength="4" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-500 text-center text-lg tracking-widest font-bold">
                </div>
                
                <div id="login-error" class="hidden text-sm font-semibold text-pink-600 bg-pink-50 p-3 rounded-xl border border-pink-100 flex items-center gap-2">
                    <i data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0"></i> PIN Incorrecto. Intenta de nuevo.
                </div>

                <button type="submit" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 px-4 rounded-xl transition duration-200 shadow-md shadow-pink-600/20 active:scale-[0.98] text-sm">
                    Entrar al Inventario
                </button>
            </form>
            <p class="text-[11px] sm:text-xs text-slate-400">Uniendo voluntades para apoyar a los niños con cáncer 💛</p>
        </div>
    </div>

    <div id="app-screen" class="hidden flex-1 flex-col min-h-screen">
        <header class="bg-white border-b border-slate-100 sticky top-0 z-40 shadow-sm px-4 py-3">
            <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-start">
                    <div class="flex items-center gap-3">
                        <img src="logo.png" alt="RAS" class="h-10 w-10 object-contain">
                        <div>
                            <h2 class="text-base font-black text-slate-900 leading-tight">Movimiento <span class="text-pink-600">RAS</span></h2>
                            <p class="text-[11px] text-slate-500 font-medium">Control de Inventario • Almacén Grande ⇄ Chico</p>
                        </div>
                    </div>
                    <button onclick="window.handleLogout()" class="md:hidden p-2 text-slate-400 hover:text-pink-600 hover:bg-pink-50 rounded-xl transition">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
                
                <div class="flex items-center gap-2 bg-slate-100 p-1 rounded-xl overflow-x-auto max-w-full w-full md:w-auto no-scrollbar">
                    <button onclick="window.filtrarEstante('todos')" id="btn-estante-todos" class="px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap transition bg-pink-600 text-white shadow-sm">Todos los Estantes</button>
                    <button onclick="window.filtrarEstante('Almacena (General)')" id="btn-estante-general" class="px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap transition text-slate-600 hover:text-sky-600">📦 Almacena (General)</button>
                    <button onclick="window.filtrarEstante('Mueble de Madera')" id="btn-estante-madera" class="px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap transition text-slate-600 hover:text-sky-600">🪵 Mueble de Madera</button>
                </div>

                <div class="hidden md:flex items-center gap-3">
                    <div class="text-right">
                        <p class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Sesión iniciada por:</p>
                        <p id="usr-actual" class="text-xs font-bold text-pink-600">Usuario</p>
                    </div>
                    <button onclick="window.handleLogout()" class="p-2 text-slate-400 hover:text-pink-600 hover:bg-pink-50 rounded-xl transition">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-7xl w-full mx-auto p-4 space-y-4">
            
            <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-100 shadow-sm space-y-3">
                <div class="flex items-center gap-2 text-pink-600 font-extrabold text-sm uppercase tracking-wider">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i>
                    <span>Registrar Nuevo Producto</span>
                </div>
                <form id="form-nuevo-producto" onsubmit="window.agregarProductoManual(event)" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3">
                    <input type="text" id="add-nombre" placeholder="Nombre (ej. Cloro)" required class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-pink-500 font-medium w-full">
                    <input type="text" id="add-categoria" placeholder="Categoría (ej. Limpieza)" required class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-pink-500 font-medium w-full">
                    <input type="text" id="add-unidad" placeholder="Unidad (ej. Pzs, Latas)" required class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-pink-500 font-medium w-full">
                    
                    <select id="add-ubicacion" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-pink-500 text-slate-600 font-medium w-full">
                        <option value="Almacena (General)">📦 Almacena (General)</option>
                        <option value="Mueble de Madera">🪵 Mueble de Madera</option>
                    </select>

                    <div class="flex gap-2 w-full">
                        <input type="number" id="add-objetivo" placeholder="Obj." min="1" required class="w-20 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-center focus:outline-none focus:ring-2 focus:ring-pink-500 font-bold">
                        <button type="submit" class="flex-1 bg-pink-600 hover:bg-pink-700 text-white font-bold text-xs py-2 px-3 rounded-xl transition shadow-sm flex items-center justify-center gap-1 active:scale-[0.97]">
                            <i data-lucide="save" class="w-3.5 h-3.5"></i> Añadir
                        </button>
                    </div>
                </form>
            </div>

            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-col sm:flex-row gap-4 items-center justify-between">
                <div class="relative w-full sm:max-w-md">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4"></i>
                    <input type="text" id="buscador" oninput="window.handleBuscar()" placeholder="Buscar producto por nombre..." class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-500">
                </div>
                
                <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                    <button onclick="window.exportarPDF('chico')" class="flex-1 sm:flex-none flex items-center justify-center gap-2 bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs py-2 px-3 rounded-xl transition shadow-sm">
                        <i data-lucide="file-text" class="w-4 h-4"></i> Reporte Chico
                    </button>
                    <button onclick="window.exportarPDF('general')" class="flex-1 sm:flex-none flex items-center justify-center gap-2 bg-pink-600 hover:bg-pink-700 text-white font-bold text-xs py-2 px-3 rounded-xl transition shadow-sm">
                        <i data-lucide="download-cloud" class="w-4 h-4"></i> Reporte Completo
                    </button>
                </div>
            </div>

            <div id="contenedor-productos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                </div>
        </main>
    </div>

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        let auth, dbRealtime;
        let inventario = [];
        let filtroEstanteActual = 'todos';
        let textoBusquedaActual = '';

        const DATA_INICIAL = [
            { id: 1, nombre: "Leche", categoria: "Lácteos", unidad: "Pzs", ubicacion: "Almacena (General)", stockObjetivo: 2, cantidadActual: 0 },
            { id: 2, nombre: "Chiles Jalapeños", categoria: "Enlatados", unidad: "Latas", ubicacion: "Almacena (General)", stockObjetivo: 1, cantidadActual: 0 },
            { id: 3, nombre: "Media Cream", categoria: "Lácteos", unidad: "Pzs", ubicacion: "Almacena (General)", stockObjetivo: 1, cantidadActual: 0 },
            { id: 4, nombre: "Aceite", categoria: "Abarrotes", unidad: "Pzs", ubicacion: "Almacena (General)", stockObjetivo: 2, cantidadActual: 0 },
            { id: 5, nombre: "Galleta María", categoria: "Galletas", unidad: "Pzs", ubicacion: "Mueble de Madera", stockObjetivo: 1, cantidadActual: 0 },
            { id: 6, nombre: "Esponja de lavar trastes", categoria: "Limpieza", unidad: "Pzs", ubicacion: "Almacena (General)", stockObjetivo: 3, cantidadActual: 0 },
            { id: 7, nombre: "Jabón para lavar trastes", categoria: "Limpieza", unidad: "Pzs", ubicacion: "Almacena (General)", stockObjetivo: 1, cantidadActual: 0 }
        ];

        const firebaseConfig = {
            apiKey: "AIzaSyAsX" + "...", 
            authDomain: "movimiento-ras-74e7c.firebaseapp.com",
            databaseURL: "https://movimiento-ras-74e7c-default-rtdb.firebaseio.com",
            projectId: "movimiento-ras-74e7c",
            storageBucket: "movimiento-ras-74e7c.appspot.com",
            messagingSenderId: "89851834241",
            appId: "1:89851834241:web:ca43cb397b988f0bc27da7"
        };

        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        dbRealtime = getDatabase(app);

        window.dbRealtimeInstance = dbRealtime;

        const savedUsr = localStorage.getItem('ras_usuario_actual');
        const localCachedData = localStorage.getItem('inventario_ras');
        if (localCachedData) {
            inventario = JSON.parse(localCachedData);
        }

        // CONTROLADOR DE PERSISTENCIA EN LA NUBE
        onAuthStateChanged(auth, async (authUser) => {
            if (authUser && savedUsr) {
                const elements = ['usr-actual', 'login-screen', 'app-screen'];
                const nodes = elements.map(id => document.getElementById(id));
                if(nodes[0]) nodes[0].innerText = savedUsr;
                if(nodes[1]) nodes[1].classList.add('hidden');
                if(nodes[2]) {
                    nodes[2].classList.remove('hidden');
                    nodes[2].classList.add('flex');
                }

                lucide.createIcons();

                const productosRef = ref(dbRealtime, 'productos');
                onValue(productosRef, (snapshot) => {
                    const datosNube = snapshot.val();
                    if (datosNube) {
                        inventario = Object.values(datosNube).filter(Boolean);
                        localStorage.setItem('inventario_ras', JSON.stringify(inventario));
                        window.renderAll();
                    } else {
                        set(ref(dbRealtime, 'productos'), DATA_INICIAL);
                    }
                });
            }
        });

        // AGREGAR PRODUCTOS DINÁMICAMENTE
        window.agregarProductoManual = function(e) {
            if (e && e.preventDefault) e.preventDefault();

            const nombre = document.getElementById('add-nombre').value.trim();
            const categoria = document.getElementById('add-categoria').value.trim();
            const unidad = document.getElementById('add-unidad').value.trim();
            const ubicacion = document.getElementById('add-ubicacion').value;
            const stockObjetivo = parseInt(document.getElementById('add-objetivo').value);

            const nuevoProd = {
                id: Date.now(),
                nombre: nombre,
                categoria: categoria,
                unidad: unidad,
                ubicacion: ubicacion,
                stockObjetivo: stockObjetivo,
                cantidadActual: 0
            };

            inventario.push(nuevoProd);
            window.renderAll();
            window.guardarSilencioso();

            document.getElementById('form-nuevo-producto').reset();
            window.showToast(`✨ ¡${nombre} guardado correctamente!`);
        };

        // ELIMINAR PRODUCTOS DE LA BASE DE DATOS
        window.eliminarProducto = function(id, nombre) {
            if (confirm(`¿Estás seguro de que deseas eliminar "${nombre}" del inventario?`)) {
                inventario = inventario.filter(prod => prod.id !== id);
                window.renderAll();
                window.guardarSilencioso();
                window.showToast(`🗑️ Producto "${nombre}" eliminado.`);
            }
        };

        // MANEJADOR DE INICIO DE SESIÓN
        window.handleLogin = async function(e) {
            if (e && e.preventDefault) e.preventDefault();

            const usuarioSel = document.getElementById('login-usuario').value;
            const pinIngresado = document.getElementById('login-pin').value;

            if (pinIngresado === '1234') {
                document.getElementById('login-error').classList.add('hidden');
                localStorage.setItem('ras_usuario_actual', usuarioSel);

                if (auth) {
                    try {
                        const emailSimulado = `${usuarioSel.toLowerCase().replace(/[^a-z0-9]/g, '')}@movimientoras.org`;
                        await signInWithEmailAndPassword(auth, emailSimulado, "Password1234_");
                    } catch (err) {
                        console.warn("Autenticación local activa.");
                    }
                }

                document.getElementById('usr-actual').innerText = usuarioSel;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('flex');
                
                window.showToast(`👋 ¡Base de datos sincronizada!`);
                window.renderAll();
                setTimeout(() => lucide.createIcons(), 100);

                const productosRef = ref(dbRealtime, 'productos');
                onValue(productosRef, (snapshot) => {
                    const datosNube = snapshot.val();
                    if (datosNube) {
                        inventario = Object.values(datosNube).filter(Boolean);
                        localStorage.setItem('inventario_ras', JSON.stringify(inventario));
                        window.renderAll();
                    }
                });
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        };

        window.handleLogout = async function() {
            try { await signOut(auth); } catch (e) {}
            localStorage.removeItem('ras_usuario_actual');
            localStorage.removeItem('inventario_ras');
            document.getElementById('login-pin').value = '';
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        };

        window.guardarSilencioso = async function() {
            localStorage.setItem('inventario_ras', JSON.stringify(inventario));
            if (window.dbRealtimeInstance) {
                try {
                    await set(ref(window.dbRealtimeInstance, 'productos'), inventario);
                } catch (error) {
                    console.error("Error en Firebase:", error);
                }
            }
        };

        window.handleBuscar = function() {
            textoBusquedaActual = document.getElementById('buscador').value.toLowerCase();
            window.renderAll();
        };

        window.filtrarEstante = function(estante) {
            filtroEstanteActual = estante;
            const botones = { 'todos': 'btn-estante-todos', 'Almacena (General)': 'btn-estante-general', 'Mueble de Madera': 'btn-estante-madera' };

            Object.keys(botones).forEach(key => {
                const btn = document.getElementById(botones[key]);
                if (btn) {
                    if (key === estante) {
                        btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap transition bg-pink-600 text-white shadow-sm";
                    } else {
                        btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap transition text-slate-600 hover:text-sky-600 hover:bg-slate-50";
                    }
                }
            });
            window.renderAll();
        };

        window.cambiarCantidad = function(id, factor) {
            const prod = inventario.find(p => p.id === id);
            if (prod) {
                const nuevaCant = prod.cantidadActual + factor;
                if (nuevaCant >= 0) {
                    prod.cantidadActual = nuevaCant;
                    window.renderAll();
                    window.guardarSilencioso();
                }
            }
        };

        // RENDERIZADO ADAPTATIVO CON APARTADO DE BORRADO
        window.renderAll = function() {
            const contenedor = document.getElementById('contenedor-productos');
            if (!contenedor) return;
            contenedor.innerHTML = '';

            const productosFiltrados = inventario.filter(prod => {
                if (!prod) return false;
                const cumpleEstante = (filtroEstanteActual === 'todos' || prod.ubicacion === filtroEstanteActual);
                const cumpleBusqueda = prod.nombre.toLowerCase().includes(textoBusquedaActual) || prod.categoria.toLowerCase().includes(textoBusquedaActual);
                return cumpleEstante && cumpleBusqueda;
            });

            if (productosFiltrados.length === 0) {
                contenedor.innerHTML = `
                    <div class="col-span-full bg-white p-12 text-center text-slate-400 font-medium rounded-2xl border border-slate-100 shadow-sm flex flex-col items-center justify-center gap-2">
                        <i data-lucide="package-open" class="w-8 h-8 text-slate-300"></i>
                        No hay productos registrados.
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            productosFiltrados.forEach(prod => {
                const falta = Math.max(0, prod.stockObjetivo - prod.cantidadActual);
                
                let badgeEstatus = '';
                if (prod.cantidadActual === 0) {
                    badgeEstatus = `<span class="inline-flex items-center gap-1 bg-pink-50 text-pink-600 text-[11px] font-bold px-2.5 py-0.5 rounded-full border border-pink-100"><span class="w-1.5 h-1.5 rounded-full bg-pink-500 animate-pulse"></span> Vacío</span>`;
                } else if (prod.cantidadActual < prod.stockObjetivo) {
                    badgeEstatus = `<span class="inline-flex items-center bg-sky-50 text-sky-700 text-[11px] font-bold px-2.5 py-0.5 rounded-full border border-sky-100">Incompleto</span>`;
                } else {
                    badgeEstatus = `<span class="inline-flex items-center bg-teal-50 text-teal-700 text-[11px] font-bold px-2.5 py-0.5 rounded-full border border-teal-100">✓ Lleno</span>`;
                }

                const tarjeta = document.createElement('div');
                tarjeta.className = "bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex flex-col justify-between hover:shadow-md transition duration-200 border-t-4 border-t-pink-500 relative";
                tarjeta.innerHTML = `
                    <div class="space-y-3">
                        <div class="flex items-start justify-between gap-6">
                            <div>
                                <h3 class="font-bold text-slate-900 text-base leading-tight pr-4">${prod.nombre}</h3>
                                <p class="text-xs text-slate-400 mt-0.5 font-medium">${prod.categoria} • ${prod.unidad}</p>
                            </div>
                            <div class="flex flex-col items-end gap-2 shrink-0">
                                ${badgeEstatus}
                                <button onclick="window.eliminarProducto(${prod.id}, '${prod.nombre}')" class="text-slate-300 hover:text-rose-600 p-1 rounded-lg hover:bg-rose-50 transition" title="Eliminar producto">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-[11px] bg-sky-50 text-sky-700 font-semibold px-2 py-0.5 rounded-md">${prod.ubicacion}</span>
                        </div>
                        <div class="grid grid-cols-2 bg-slate-50 p-2.5 rounded-xl text-center text-xs font-semibold gap-2 border border-slate-100/50">
                            <div>
                                <p class="text-slate-400 text-[10px] uppercase font-bold tracking-wider">Objetivo</p>
                                <p class="text-slate-700 font-extrabold text-sm mt-0.5">${prod.stockObjetivo}</p>
                            </div>
                            <div class="border-l border-slate-200">
                                <p class="text-slate-400 text-[10px] uppercase font-bold tracking-wider">Falta llevar</p>
                                <p class="font-extrabold text-sm mt-0.5 ${falta > 0 ? 'text-pink-600' : 'text-slate-400'}">${falta > 0 ? `${falta} pzs` : '—'}</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between mt-5 pt-3 border-t border-slate-50">
                        <span class="text-xs font-bold text-slate-400">Cantidad en Almacén</span>
                        <div class="flex items-center gap-3">
                            <button onclick="window.cambiarCantidad(${prod.id}, -1)" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center font-bold transition text-lg active:scale-90">-</button>
                            <span class="w-6 text-center font-black text-lg text-slate-900">${prod.cantidadActual}</span>
                            <button onclick="window.cambiarCantidad(${prod.id}, 1)" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center font-bold transition text-lg active:scale-90">+</button>
                        </div>
                    </div>
                `;
                contenedor.appendChild(tarjeta);
            });

            lucide.createIcons();
        };

        // GENERACIÓN DE REPORTES EN PDF
        window.exportarPDF = function(tipo) {
            const { jsPDF } = window.jspdf;
            const docPDF = new jsPDF('p', 'pt', 'a4');
            const fechaActual = new Date().toLocaleDateString('es-MX');

            docPDF.setFillColor(219, 39, 119);
            docPDF.rect(0, 0, 595, 75, 'F');
            docPDF.setTextColor(255, 255, 255);
            docPDF.setFont("helvetica", "bold");
            docPDF.setFontSize(18);
            docPDF.text("FUNDACIÓN MOVIMIENTO RAS", 35, 34);
            docPDF.setFontSize(10);
            docPDF.setFont("helvetica", "normal");
            docPDF.text("Sistema de Auditoría y Control de Doble Almacén", 35, 52);
            docPDF.text(`Fecha: ${fechaActual}`, 480, 44);

            let productosParaPDF = [...inventario].filter(Boolean);
            if (tipo === 'chico') {
                productosParaPDF = productosParaPDF.filter(p => (p.stockObjetivo - p.cantidadActual) > 0);
            }

            const productosVacios = productosParaPDF.filter(p => p.cantidadActual === 0);
            const productosIncompletos = productosParaPDF.filter(p => p.cantidadActual > 0 && p.cantidadActual < p.stockObjetivo);
            const productosLlenos = productosParaPDF.filter(p => p.cantidadActual >= p.stockObjetivo);

            let coordenadaYActual = 110;
            const columnasTabla = ["Producto / Categoría", "Ubicación", "Objetivo", "Actual", "Acción Requerida"];

            function construirSeccionTabla(tituloSeccion, listadoProductos, colorRGB) {
                if (listadoProductos.length === 0) return;
                docPDF.setFillColor(248, 250, 252);
                docPDF.rect(35, coordenadaYActual - 15, 525, 22, 'F');
                docPDF.setTextColor(colorRGB[0], colorRGB[1], colorRGB[2]);
                docPDF.setFont("helvetica", "bold");
                docPDF.setFontSize(11);
                docPDF.text(tituloSeccion, 42, coordenadaYActual);

                const filasDatos = listadoProductos.map(p => {
                    const diferencia = p.stockObjetivo - p.cantidadActual;
                    return [
                        `${p.nombre}\n(${p.categoria})`, p.ubicacion, `${p.stockObjetivo} pzs`, `${p.cantidadActual} pzs`,
                        diferencia > 0 ? `Faltan ${diferencia} ${p.unit || 'pzs'}` : "Surtido Completo"
                    ];
                });

                docPDF.autoTable({
                    head: [columnasTabla], body: filasDatos, startY: coordenadaYActual + 8,
                    margin: { left: 35, right: 35 }, theme: 'striped', styles: { fontSize: 9, cellPadding: 6 },
                    headStyles: { fillColor: colorRGB, fontStyle: 'bold' },
                    columnStyles: { 0: { cellWidth: 150 }, 1: { cellWidth: 120 }, 2: { cellWidth: 60, halign: 'center' }, 3: { cellWidth: 60, halign: 'center' }, 4: { cellWidth: 135, fontStyle: 'bold' } }
                });
                coordenadaYActual = docPDF.lastAutoTable.finalY + 35;
            }

            construirSeccionTabla("1. ESTANTES COMPLETAMENTE VACÍOS (URGENTE)", productosVacios, [219, 39, 119]);
            construirSeccionTabla("2. PRODUCTOS CON STOCK INSUFICIENTE (POR SURTIR)", productosIncompletos, [217, 119, 6]);
            if (tipo === 'general') {
                construirSeccionTabla("3. PRODUCTOS CON INVENTARIO ÓPTIMO", productosLlenos, [2, 132, 199]);
            }

            docPDF.setFontSize(8); docPDF.setTextColor(148, 163, 184);
            docPDF.text("Este reporte fue generado de forma automatizada por el Sistema de Inventario Movimiento RAS.", 35, 810);
            const nombreLimpioFecha = fechaActual.replace(/\//g, '-');
            docPDF.save(`Reporte_Inventario_RAS_${tipo}_${nombreLimpioFecha}.pdf`);
            window.showToast("📄 Reporte en PDF generado con éxito.");
        };

        // NOTIFICACIONES TOAST
        window.showToast = function(mensaje) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = "bg-slate-900 text-white text-xs font-bold px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 animate-slide-in pointer-events-auto min-w-[200px]";
            toast.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4 text-sky-400 flex-shrink-0"></i><span>${mensaje}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2', 'transition', 'duration-300');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        };
    </script>
</body>
</html>
